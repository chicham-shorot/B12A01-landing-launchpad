<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Simple Landing Launchpad</title>
    <link rel="stylesheet" href="./styles/style.css">
  </head>
  <body>
    <header>
        <!-- navigation var section start  -->
        <nav class="nav-container">
            <div class="nav-logo">
                <h1 class="page-logo"><a href="index.html">Logo</a></h1>
            </div>
            <button class="sign-up-btn">Sign Up</button>
        </nav>
        <!-- banner section start  -->
        <div class="banner-container">
            <div class="banner-content">
                <h1 class="banner-title">Cool Dark UI Template for <br>Webflow Agencies!</h1>
                <button class="banner-btn">Stay Focused</button>
            </div>
        </div>
    </header>
    <main>
         <!-- Action section start here  -->
        <section class="action-container">
            <div class="action-content">
                <h2 class="action-title">See It in Action</h2>
                <p class="action-description">Explore the live preview and imagine your brand in this bold new look.</p>
                <button class="action-btn">Launch Live Preview</button>
            </div>
            <div class="action-image">
                <img src="./Assets/wc-mini.png" alt="this is banner of Webflow conference in 2022">
            </div>
        </section>
    </main>
    <footer>

    </footer>
  </body>
</html>
